<script
  src="/assets/js/pool-config.js"
  defer
  data-pool-config-script="true"
  data-worker-base="{{ site.worker_base }}"
  data-platform-name="{{ site.author | escape }}"
  data-sales-tax-rate="{{ site.sales_tax_rate | default: 0.07875 }}"
  data-flat-shipping-rate="{{ site.flat_shipping_rate | default: 3.00 }}"
  data-live-stats-cache-ttl-seconds="{{ site.live_stats_cache_ttl_seconds | default: 300 }}"
  data-live-inventory-cache-ttl-seconds="{{ site.live_inventory_cache_ttl_seconds | default: 300 }}"
  data-cart-runtime="{{ site.cart_runtime | default: 'first_party' }}"
  data-checkout-provider="{{ site.checkout_provider | default: 'first_party' }}"
  data-checkout-ui-mode="{{ site.checkout_ui_mode | default: 'hosted' }}"
  data-stripe-publishable-key="{{ site.stripe_publishable_key | default: '' }}"></script>
{% assign pool_checkout_ui_mode = site.checkout_ui_mode | default: 'hosted' %}
{% if pool_checkout_ui_mode == 'custom' %}
<link rel="preconnect" href="https://js.stripe.com" crossorigin>
<link rel="preconnect" href="https://api.stripe.com" crossorigin>
<link rel="dns-prefetch" href="//js.stripe.com">
<link rel="dns-prefetch" href="//api.stripe.com">
{% endif %}
<div hidden data-pool-cart-root="true"></div>
<script src="/assets/js/stripe-checkout-sidecar.js" defer></script>
<script src="/assets/js/cart-provider.js" defer></script>
<script src="/assets/js/cart.js" defer></script>
<script src="/assets/js/buy-buttons.js" defer></script>
<script src="/assets/js/campaign.js" defer></script>
