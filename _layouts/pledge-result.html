<!doctype html>
<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% include pledge-result-csp.html %}
  {% include cart-head.html %}
  <title>{{ page.title }} · {{ site.title }}</title>
</head>
<body>

      <div class="site-footer__copyright">
