name: Deploy Production

on:
  push:
    branches: [main]
  schedule:
    # Run daily at 7:00 AM UTC (midnight MST) to update campaign states
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual rebuild'
        required: false
        default: 'manual'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "production"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Verify campaigns.json exists
        run: |
          if [ ! -f "_site/api/campaigns.json" ]; then
            echo "ERROR: campaigns.json was not generated!"
            exit 1
          fi
          echo "campaigns.json contents:"
          cat _site/api/campaigns.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        if: ${{ github.event_name == 'push' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        if: ${{ github.event_name == 'push' }}
        working-directory: worker
        run: npm ci

      - name: Deploy Worker
        if: ${{ github.event_name == 'push' }}
        working-directory: worker
        run: npx wrangler deploy -c wrangler.toml --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Purge Cloudflare cache
        if: ${{ vars.CLOUDFLARE_ENABLED == 'true' }}
        uses: jakejarvis/cloudflare-purge-action@master
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_KEY: ${{ secrets.CLOUDFLARE_KEY }}

      - name: Check for new diary entries
        if: success()
        run: |
          sleep 30  # Wait for CDN propagation after cache purge
          DIARY_RESPONSE="$(mktemp)"
          DIARY_STATUS="$(curl -sS -o "$DIARY_RESPONSE" -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.ADMIN_SECRET }}" \
            -H "Content-Type: application/json" \
            https://pledge.dustwave.xyz/admin/diary/check || true)"

          if [ "$DIARY_STATUS" -ge 200 ] && [ "$DIARY_STATUS" -lt 300 ]; then
            echo "Diary check completed (HTTP $DIARY_STATUS):"
            cat "$DIARY_RESPONSE"
          else
            echo "Diary check failed (non-fatal, HTTP ${DIARY_STATUS:-curl-error}):"
            cat "$DIARY_RESPONSE"
          fi
