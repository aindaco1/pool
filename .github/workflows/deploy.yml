name: Deploy Production

on:
  push:
    branches: [main]
  schedule:
    # Run at midnight Mountain Time in MDT and MST to update campaign states.
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual rebuild'
        required: false
        default: 'manual'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "production"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Minify generated assets
        run: npm run assets:minify

      - name: Verify campaigns.json exists
        run: |
          if [ ! -f "_site/api/campaigns.json" ]; then
            echo "ERROR: campaigns.json was not generated!"
            exit 1
          fi
          echo "campaigns.json contents:"
          cat _site/api/campaigns.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        if: ${{ github.event_name == 'push' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Setup Ruby
        if: ${{ github.event_name == 'push' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install Worker dependencies
        if: ${{ github.event_name == 'push' }}
        working-directory: worker
        run: npm ci

      - name: Sync Worker config
        if: ${{ github.event_name == 'push' }}
        run: ruby ./scripts/sync-worker-config.rb

      - name: Deploy Worker
        if: ${{ github.event_name == 'push' }}
        working-directory: worker
        run: npx wrangler deploy -c wrangler.toml --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Purge Cloudflare cache
        if: ${{ vars.CLOUDFLARE_ENABLED == 'true' }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE" ]; then
            echo "CLOUDFLARE_ZONE secret is required to purge cache."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_CACHE_PURGE_TOKEN" ]; then
            echo "CLOUDFLARE_CACHE_PURGE_TOKEN or CLOUDFLARE_API_TOKEN secret is required to purge cache."
            exit 1
          fi

          response="$(mktemp)"
          status="$(curl -sS -o "$response" -w "%{http_code}" \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_CACHE_PURGE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Cloudflare cache purge failed with status $status"
            cat "$response"
            exit 1
          fi
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}

      - name: Check for new diary entries
        if: success()
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_BROADCAST_SECRET || secrets.ADMIN_SECRET }}
          DIARY_CHECK_BYPASS_SECRET: ${{ secrets.DIARY_CHECK_BYPASS_SECRET }}
        run: |
          sleep 30  # Wait for CDN propagation after cache purge
          DIARY_RESPONSE="$(mktemp)"
          DIARY_CURL_HEADERS=(
            -H "Authorization: Bearer $ADMIN_SECRET"
            -H "Content-Type: application/json"
          )
          if [ -n "$DIARY_CHECK_BYPASS_SECRET" ]; then
            DIARY_CURL_HEADERS+=(-H "X-Pool-Diary-Check: $DIARY_CHECK_BYPASS_SECRET")
          fi

          DIARY_STATUS="$(curl -sS -o "$DIARY_RESPONSE" -w "%{http_code}" -X POST \
            "${DIARY_CURL_HEADERS[@]}" \
            https://pledge.dustwave.xyz/admin/diary/check || true)"

          if [ "$DIARY_STATUS" -ge 200 ] && [ "$DIARY_STATUS" -lt 300 ]; then
            echo "Diary check completed (HTTP $DIARY_STATUS):"
            cat "$DIARY_RESPONSE"
          elif grep -qiE 'Just a moment|challenge-platform|__cf_chl' "$DIARY_RESPONSE"; then
            echo "Diary check was blocked by a Cloudflare challenge (non-fatal, HTTP ${DIARY_STATUS:-curl-error})."
            echo "Configure a Cloudflare WAF skip rule for POST /admin/diary/check with the X-Pool-Diary-Check header, while keeping Worker ADMIN_SECRET auth enabled."
          else
            echo "Diary check failed (non-fatal, HTTP ${DIARY_STATUS:-curl-error}):"
            cat "$DIARY_RESPONSE"
          fi
