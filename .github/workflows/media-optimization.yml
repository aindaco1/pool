name: Optimize dashboard media

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Media scope to optimize'
        required: true
        default: changed
        type: choice
        options:
          - changed
          - all
  push:
    branches:
      - main
    paths:
      - 'assets/images/**'
      - 'assets/videos/**'
      - 'assets/audio/**'
      - '_data/media-optimization-manifest.json'
      - '_campaigns/**'
      - '_config.yml'
      - 'scripts/optimize-media.mjs'
      - '.github/workflows/media-optimization.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: media-optimization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 2

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg optipng libjpeg-turbo-progs gifsicle webp

      - name: Optimize media
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.scope }}" = "all" ]; then
            node ./scripts/optimize-media.mjs --write
          else
            node ./scripts/optimize-media.mjs --write --changed
          fi

      - name: Open media optimization pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "No media optimization changes."
            exit 0
          fi
          branch="bot/media-optimization-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          for media_path in assets/images assets/videos assets/audio _data/media-optimization-manifest.json _campaigns _config.yml; do
            if [ -e "$media_path" ] || [ -n "$(git ls-files -- "$media_path")" ]; then
              git add -A -- "$media_path"
            fi
          done
          git commit -m "Optimize dashboard media uploads"
          git push --set-upstream origin "$branch"
          pr_error="$(mktemp)"
          if ! gh pr create \
            --base main \
            --head "$branch" \
            --title "Optimize dashboard media uploads" \
            --body "Automated media optimization output from run ${GITHUB_RUN_ID}. Review the generated assets and campaign/config reference updates before merging." 2>"$pr_error"; then
            if grep -Fq 'GitHub Actions is not permitted to create or approve pull requests' "$pr_error"; then
              echo "::notice title=Media changes ready for review::Repository policy requires a maintainer to open the pull request: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
            else
              cat "$pr_error" >&2
              rm -f "$pr_error"
              exit 1
            fi
          fi
          rm -f "$pr_error"
