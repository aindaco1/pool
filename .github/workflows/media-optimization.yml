name: Optimize dashboard media

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'assets/images/**'
      - 'assets/videos/**'
      - '_campaigns/**'
      - '_config.yml'

permissions:
  contents: write

concurrency:
  group: media-optimization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg oxipng libjpeg-turbo-progs gifsicle webp

      - name: Optimize changed media
        run: node ./scripts/optimize-media.mjs --write --changed

      - name: Commit optimized media
        run: |
          if git diff --quiet; then
            echo "No media optimization changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images assets/videos _campaigns _config.yml
          git commit -m "Optimize dashboard media uploads"
          git push
