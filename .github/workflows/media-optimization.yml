name: Optimize dashboard media

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Media scope to optimize'
        required: true
        default: changed
        type: choice
        options:
          - changed
          - all
  push:
    branches:
      - main
    paths:
      - 'assets/images/**'
      - 'assets/videos/**'
      - '_campaigns/**'
      - '_config.yml'
      - 'scripts/optimize-media.mjs'
      - '.github/workflows/media-optimization.yml'

permissions:
  contents: write

concurrency:
  group: media-optimization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg optipng libjpeg-turbo-progs gifsicle webp

      - name: Optimize media
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.scope }}" = "all" ]; then
            node ./scripts/optimize-media.mjs --write
          else
            node ./scripts/optimize-media.mjs --write --changed
          fi

      - name: Commit optimized media
        run: |
          if git diff --quiet; then
            echo "No media optimization changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images assets/videos _campaigns _config.yml
          git commit -m "Optimize dashboard media uploads"
          git push
