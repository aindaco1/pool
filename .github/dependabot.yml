version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # Shared tooling follows the reviewed Platform gitlink. Keep security
    # updates eligible; routine version bumps belong in a Platform upgrade.
    ignore:
      - dependency-name: esbuild
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: smol-toml
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      root-development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      worker-development-dependencies:
        dependency-type: development
