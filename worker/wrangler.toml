name = "pledge-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"
workers_dev = false

routes = [
  { pattern = "pledge.dustwave.xyz/*", zone_name = "dustwave.xyz" }
]

# Cron triggers:
# - `0 7 * * *`: daily campaign transition + settlement checks
# - `*/15 * * * *`: retry failed supporter confirmation emails
[triggers]
crons = ["0 7 * * *", "*/15 * * * *"]

[vars]
SITE_BASE = "https://pool.dustwave.xyz"
WORKER_BASE = "https://pledge.dustwave.xyz"
APP_MODE = "live"
PLATFORM_NAME = "The Pool"
PLATFORM_COMPANY_NAME = "Dust Wave"
PLATFORM_AUTHOR = "Dust Wave"
SUPPORT_EMAIL = "info@dustwave.xyz"
PLEDGES_EMAIL_FROM = "The Pool <pledges@dustwave.xyz>"
UPDATES_EMAIL_FROM = "The Pool <updates@pool.dustwave.xyz>"
SALES_TAX_RATE = "0.07625"
FLAT_SHIPPING_RATE = "3.00"
SHIPPING_ORIGIN_ZIP = "87120"
SHIPPING_ORIGIN_COUNTRY = "US"
SHIPPING_FALLBACK_FLAT_RATE = "3.00"
FREE_SHIPPING_DEFAULT = "false"
USPS_ENABLED = "true"
USPS_CLIENT_ID = ""
USPS_API_BASE = ""
USPS_TIMEOUT_MS = "5000"
USPS_QUOTE_CACHE_TTL_SECONDS = "600"
USPS_FAILURE_COOLDOWN_SECONDS = "300"
USPS_RATE_LIMIT_COOLDOWN_SECONDS = "1800"
DEBUG_CONSOLE_LOGGING_ENABLED = "true"
DEBUG_VERBOSE_CONSOLE_LOGGING = "true"
DEFAULT_PLATFORM_TIP_PERCENT = "5"
MAX_PLATFORM_TIP_PERCENT = "15"

[[durable_objects.bindings]]
name = "CHECKOUT_INTENTS"
class_name = "CheckoutIntentNonceCoordinator"

[[durable_objects.bindings]]
name = "TIER_INVENTORY_COORDINATOR"
class_name = "TierInventoryCoordinator"

[[migrations]]
tag = "v1"
new_classes = ["CheckoutIntentNonceCoordinator"]

[[migrations]]
tag = "v2"
new_classes = ["TierInventoryCoordinator"]

# KV Namespaces - update IDs after running:
#   wrangler kv:namespace create "VOTES"
#   wrangler kv:namespace create "VOTES" --preview
#   wrangler kv:namespace create "PLEDGES"
#   wrangler kv:namespace create "PLEDGES" --preview
#   wrangler kv:namespace create "RATELIMIT"
#   wrangler kv:namespace create "RATELIMIT" --preview
[[kv_namespaces]]
binding = "VOTES"
id = "9f11222dad2b4eb7bf80647f4361784a"
preview_id = "1801ccfaf70344f49cb62ae0d58403c9"

[[kv_namespaces]]
binding = "PLEDGES"
id = "2a2935911eef4a3d8e64ad83d7f7b1ee"
preview_id = "384641ed237c465ca55eeba08f163d38"

# SEC-005: Rate limiting KV (optional - rate limiting disabled if not configured)
[[kv_namespaces]]
binding = "RATELIMIT"
id = "c55b47f5699244c5ac723018019e61e1"
preview_id = "68f522d8316c49b6b2922767d67c9d8a"

# Secrets (set via `wrangler secret put <NAME>`):
# Required:
# - STRIPE_SECRET_KEY          (Stripe secret key - used if _TEST/_LIVE not set)
# - MAGIC_LINK_SECRET          (HMAC secret for token signing)
# - CHECKOUT_INTENT_SECRET     (HMAC secret for first-party checkout intent signing)
# - RESEND_API_KEY             (Resend email API key)
# - ADMIN_SECRET               (Admin API key for broadcast/rebuild endpoints)
#
# Optional (for separate test/live keys):
# - STRIPE_SECRET_KEY_LIVE / STRIPE_SECRET_KEY_TEST
# - STRIPE_WEBHOOK_SECRET_LIVE / STRIPE_WEBHOOK_SECRET_TEST
# - STRIPE_WEBHOOK_SECRET      (webhook signing secret)
# - USPS_CLIENT_SECRET         (USPS OAuth client secret for live shipping quotes)
#
# Optional (for GitHub rebuild trigger):
# - GITHUB_TOKEN               (GitHub PAT with workflow scope)
# - GITHUB_OWNER               (defaults to 'aindaco1')
# - GITHUB_REPO                (defaults to 'pool')
# - GITHUB_WORKFLOW            (defaults to 'deploy.yml')

# Development overrides
# Keep local Worker defaults aligned with `_config.local.yml` so local
# checkout exercises the first-party path end to end without changing
# production defaults.
[env.dev]
vars = { SITE_BASE = "http://127.0.0.1:4000", WORKER_BASE = "http://127.0.0.1:8787", APP_MODE = "test", PLATFORM_NAME = "The Pool", PLATFORM_COMPANY_NAME = "Dust Wave", PLATFORM_AUTHOR = "Dust Wave", SUPPORT_EMAIL = "info@dustwave.xyz", PLEDGES_EMAIL_FROM = "The Pool <pledges@dustwave.xyz>", UPDATES_EMAIL_FROM = "The Pool <updates@pool.dustwave.xyz>", SALES_TAX_RATE = "0.07625", FLAT_SHIPPING_RATE = "3.00", SHIPPING_ORIGIN_ZIP = "87120", SHIPPING_ORIGIN_COUNTRY = "US", SHIPPING_FALLBACK_FLAT_RATE = "3.00", FREE_SHIPPING_DEFAULT = "false", USPS_ENABLED = "true", USPS_CLIENT_ID = "", USPS_API_BASE = "", USPS_TIMEOUT_MS = "5000", USPS_QUOTE_CACHE_TTL_SECONDS = "600", USPS_FAILURE_COOLDOWN_SECONDS = "300", USPS_RATE_LIMIT_COOLDOWN_SECONDS = "1800", DEBUG_CONSOLE_LOGGING_ENABLED = "true", DEBUG_VERBOSE_CONSOLE_LOGGING = "true", DEFAULT_PLATFORM_TIP_PERCENT = "5", MAX_PLATFORM_TIP_PERCENT = "15" }

[[env.dev.durable_objects.bindings]]
name = "CHECKOUT_INTENTS"
class_name = "CheckoutIntentNonceCoordinator"

[[env.dev.durable_objects.bindings]]
name = "TIER_INVENTORY_COORDINATOR"
class_name = "TierInventoryCoordinator"

[[env.dev.kv_namespaces]]
binding = "VOTES"
id = "9f11222dad2b4eb7bf80647f4361784a"
preview_id = "1801ccfaf70344f49cb62ae0d58403c9"

[[env.dev.kv_namespaces]]
binding = "PLEDGES"
id = "2a2935911eef4a3d8e64ad83d7f7b1ee"
preview_id = "384641ed237c465ca55eeba08f163d38"

[[env.dev.kv_namespaces]]
binding = "RATELIMIT"
id = "c55b47f5699244c5ac723018019e61e1"
preview_id = "68f522d8316c49b6b2922767d67c9d8a"
