[[migrations]]
tag = "v1"
new_sqlite_classes = ["CheckoutIntentNonceCoordinator"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["TierInventoryCoordinator"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["SettlementCoordinator"]

