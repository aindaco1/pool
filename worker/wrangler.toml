SEO_X_HANDLE = ""
SEO_SAME_AS = ""
SEO_RETURN_POLICY_APPLICABLE_COUNTRY = "US"
SEO_RETURN_POLICY_CATEGORY = "https://schema.org/MerchantReturnNotPermitted"
