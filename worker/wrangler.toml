# Secrets (set via `wrangler secret put <NAME>`):
# Required:
# - STRIPE_SECRET_KEY          (Stripe secret key - used if _TEST/_LIVE not set)
# - MAGIC_LINK_SECRET          (HMAC secret for token signing)
# - CHECKOUT_INTENT_SECRET     (HMAC secret for first-party checkout intent signing)
# - RESEND_API_KEY             (Resend email API key)
# - RESEND_WEBHOOK_SECRET      (Resend/Svix webhook signing secret for delivery and suppression events)
# - ADMIN_SECRET               (Admin API key for recovery/rebuild endpoints and scoped-secret fallback)
# - TURNSTILE_SECRET_KEY       (shared Cloudflare Turnstile secret for admin sign-in and launch reminder challenges)
# - POOL_PODCAST_BRIDGE_SECRET (dedicated HMAC secret for Podcast benefit grant/revoke delivery when enabled)
#
# Optional (for separate test/live keys):
# - STRIPE_SECRET_KEY_LIVE / STRIPE_SECRET_KEY_TEST
# - STRIPE_WEBHOOK_SECRET_LIVE / STRIPE_WEBHOOK_SECRET_TEST
# - STRIPE_WEBHOOK_SECRET      (webhook signing secret)
# - FILM_STRIPE_SUMMARY_ADAPTER_SECRET (shared bearer secret for Film summary-only aggregate reads)
# - USPS_CLIENT_SECRET         (USPS OAuth client secret for live shipping quotes)
# - ADMIN_SETTLEMENT_SECRET    (scoped settlement endpoint secret; rejects ADMIN_SECRET when set)
# - ADMIN_BROADCAST_SECRET     (scoped broadcast/diary/milestone endpoint secret; rejects ADMIN_SECRET when set)
# - ADMIN_TURNSTILE_SECRET_KEY (admin-specific Turnstile secret if not using TURNSTILE_SECRET_KEY)
# - LAUNCH_REMINDER_TURNSTILE_SECRET_KEY (reminder-specific Turnstile secret if not using TURNSTILE_SECRET_KEY)
# - LAUNCH_REMINDER_TOKEN_SECRET (optional unsubscribe-token secret; falls back to MAGIC_LINK_SECRET)
# - ABANDONED_CART_TOKEN_SECRET (optional checkout-reminder unsubscribe-token secret; falls back to MAGIC_LINK_SECRET)
#
# Optional (for GitHub rebuild trigger):
# - GITHUB_TOKEN               (GitHub PAT with workflow scope)
# - GITHUB_OWNER               (defaults to 'aindaco1')
# - GITHUB_REPO                (defaults to 'pool')
# - GITHUB_WORKFLOW            (defaults to 'deploy.yml')
# - ADMIN_TURNSTILE_REQUIRED   (set true to fail closed when Turnstile is expected)
# - ADMIN_TURNSTILE_BYPASS     (local/test-only bypass for automated admin auth tests)
# - LAUNCH_REMINDER_TURNSTILE_REQUIRED (set true to fail closed when reminder Turnstile is expected)
# - LAUNCH_REMINDER_TURNSTILE_BYPASS   (local/test-only bypass for reminder signup automation)
# - LAUNCH_REMINDER_DISPATCH_BATCH_SIZE (optional reminder send batch size)
# - LAUNCH_REMINDER_DISPATCH_JOB_LIMIT  (optional reminder dispatch jobs per scheduled tick)

