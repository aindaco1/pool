PODCAST_BRIDGE_URL = "https://feeds.dustwave.xyz/v1/internal/pool/grants"
PODCAST_BRIDGE_TIMEOUT_MS = "5000"
PLATFORM_FOOTER_LOGO_PATH = "/assets/images/defaults/dust-wave-square.png"
