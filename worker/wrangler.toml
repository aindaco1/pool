name = "pledge-worker"
main = "src/index.js"
compatibility_date = "2026-05-03"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

routes = [
  { pattern = "pledge.dustwave.xyz/*", zone_name = "dustwave.xyz" }
]

# Cron trigger:
# - `* * * * *`: timezone-aware platform scheduler. Individual tasks gate on
#   the configured platform timezone and idempotency markers.
[triggers]
crons = ["* * * * *"]

[vars]
SITE_BASE = "https://pool.dustwave.xyz"
WORKER_BASE = "https://pledge.dustwave.xyz"
CANONICAL_SITE_BASE = "https://pool.dustwave.xyz"
CANONICAL_WORKER_BASE = "https://pledge.dustwave.xyz"
CORS_ALLOWED_ORIGIN = "https://pool.dustwave.xyz"
APP_MODE = "live"
ADMIN_USERS_JSON = "[{\"name\":\"Alonso\",\"email\":\"alonso@dustwave.xyz\",\"role\":\"super_admin\",\"campaignSlugs\":[]}]"
SITE_TITLE = "The Pool"
SITE_DESCRIPTION = "The Pool is Dust Wave's crowdfunding platform for independent film and creative projects."
PLATFORM_NAME = "The Pool"
PLATFORM_COMPANY_NAME = "Dust Wave"
PLATFORM_AUTHOR = "Dust Wave"
PLATFORM_DEFAULT_CREATOR_NAME = "Dust Wave"
PLATFORM_TIMEZONE = "America/Denver"
SUPPORT_EMAIL = "info@dustwave.xyz"
PLEDGES_EMAIL_FROM = "The Pool <pledges@pool.dustwave.xyz>"
UPDATES_EMAIL_FROM = "The Pool <updates@pool.dustwave.xyz>"
EMAIL_OUTBOX_ENABLED = "true"
PAYMENT_RECONCILIATION_ENABLED = "true"
