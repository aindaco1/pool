title: The Pool
author: Dust Wave
description: The Pool is Dust Wave's crowdfunding platform for independent film and creative projects.
url: https://pool.dustwave.xyz
markdown: kramdown
permalink: pretty

seo:
  x_handle: ""
  same_as: []
  index_public_community_hub: true
  default_social_image_alt: "The Pool"
  merchant_return_policy:
    applicable_country: US
    return_policy_category: https://schema.org/MerchantReturnNotPermitted
  og_locale_overrides:
    en: en_US
    es: es_ES

debug:
  console_logging_enabled: true
  verbose_console_logging: false

exclude:
  - README.md
  - LICENSE
  - worker
  - scripts
  - tests
  - test-results
  - playwright-report
  - package.json
  - package-lock.json
  - playwright.config.js
  - vitest.config.mts
  - vitest.security.config.mts
  - Containerfile.dev
  - Containerfile.playwright.dev

# Structured platform settings for forks.
platform:
  name: The Pool
  version: "1.2.2"
  release_label: "v1.2.2"
  company_name: Dust Wave
  support_email: info@dustwave.xyz
  pledges_email_from: "The Pool <pledges@pool.dustwave.xyz>"
  updates_email_from: "The Pool <updates@pool.dustwave.xyz>"
  site_url: "https://pool.dustwave.xyz"
  worker_url: "https://pledge.dustwave.xyz"
  default_creator_name: Dust Wave
  timezone: America/Denver
  logo_path: /assets/images/defaults/dust-wave-square.png
  footer_logo_path: /assets/images/defaults/dust-wave-square.png
  favicon_path: /assets/images/defaults/favicon.png
  default_social_image_path: /assets/images/defaults/dust-wave-square.png

email:
  outbox_enabled: true

payments:
  reconciliation_enabled: true

podcast_benefits:
  # The bridge and every product/tier mapping remain off until a controlled
  # staging grant/revoke exercise has passed.
  enabled: false
  bridge_url: "https://feeds.dustwave.xyz/v1/internal/pool/grants"
  bridge_timeout_ms: 5000
  mappings: []

admin:
  # Canonical production URLs surfaced in the local admin UI even when
  # platform.site_url / platform.worker_url are overridden for development.
  production_site_url: "https://pool.dustwave.xyz"
  production_worker_url: "https://pledge.dustwave.xyz"
  # Optional Cloudflare Turnstile site key for the admin sign-in challenge.
  # Keep the matching secret key in Worker secrets as TURNSTILE_SECRET_KEY.
  turnstile_site_key: "0x4AAAAAADWvXKd12BE4fhQL"
  # Seed/recovery dashboard users mirrored into ADMIN_USERS_JSON. Runtime edits
  # made from the dashboard are stored in Worker KV at admin-users:v1.
  users:
    - name: Alonso
      email: alonso@dustwave.xyz
      role: super_admin
      campaigns: []
  # Local-only bootstrap super admins belong in ignored `worker/.dev.vars` as
  # ADMIN_BOOTSTRAP_EMAILS so forks can choose their own local sign-in email
  # without editing committed config.
  local_test_campaigns:
    - hand-relations
    - smoke-editable

# Top-level mirrors used by Liquid layouts because some local build paths do not
# expose the nested `admin` config object reliably.
admin_production_site_url: "https://pool.dustwave.xyz"
admin_production_worker_url: "https://pledge.dustwave.xyz"

launch_reminders:
  enabled: true
  # Optional Cloudflare Turnstile site key for public upcoming-campaign launch reminder forms.
  # Keep the matching secret key in Worker secrets as TURNSTILE_SECRET_KEY or LAUNCH_REMINDER_TURNSTILE_SECRET_KEY.
  turnstile_site_key: "0x4AAAAAADWvXKd12BE4fhQL"

pricing:
  sales_tax_rate: 0.07625
  flat_shipping_rate: 3.00
  default_tip_percent: 5
  max_tip_percent: 15

tax:
  # `flat` keeps the legacy configured-rate behavior.
  # `offline_rules` uses vendored international/state-level rules.
  # `nm_grt` uses a vendored New Mexico starter dataset and can refine with the
  # free EDAC GRT API when a full street address is available.
  # `zip_tax` uses ZIP.TAX for local/jurisdiction-level US tax lookups.
  provider: "nm_grt"
  origin_country: "US"
  use_regional_origin: false
  nm_grt_api_base: "https://grt.edacnm.org"
  zip_tax_api_base: "https://api.zip-tax.com"

shipping:
  origin_zip: "87120"
  origin_country: "US"
  fallback_flat_rate: 3.00
  free_shipping_default: false
  default_option: standard
  # USPS OAuth config is fork-facing here for non-secret settings only.
  # Keep the companion USPS client secret in Worker secrets / worker/.dev.vars.
  usps:
    enabled: true
    client_id: ""
    api_base: ""
    timeout_ms: 5000
    quote_cache_ttl_seconds: 600
    failure_cooldown_seconds: 300
    rate_limit_cooldown_seconds: 1800
  presets:
    tshirt:
      weight_oz: 6.5
      packaging_weight_oz: 1
      length_in: 12
      width_in: 10
      height_in: 1.5
      stack_height_in: 0.5
    sticker:
      weight_oz: 1
      packaging_weight_oz: 0.5
      length_in: 11.5
      width_in: 6.125
      height_in: 0.2
      stack_height_in: 0.05
      manual_domestic_rate: FIRST_CLASS_FLAT
      usps_domestic:
        processing_category: NON_MACHINABLE
        rate_indicator: SP
        mail_classes:
          - USPS_GROUND_ADVANTAGE
          - PRIORITY_MAIL
    poster:
      weight_oz: 5
      packaging_weight_oz: 3
      length_in: 18
      width_in: 3
      height_in: 3
      stack_height_in: 0.5
    cd:
      weight_oz: 4
      packaging_weight_oz: 2
      length_in: 6.25
      width_in: 6.25
      height_in: 1
      stack_height_in: 0.25
      usps_domestic:
        processing_category: MACHINABLE
        rate_indicator: SP
        mail_classes:
          - MEDIA_MAIL
          - USPS_GROUND_ADVANTAGE
          - PRIORITY_MAIL
    vinyl:
      weight_oz: 18
      packaging_weight_oz: 4
      length_in: 13.5
      width_in: 13.5
      height_in: 1
      stack_height_in: 0.35
    dvd:
      weight_oz: 4
      packaging_weight_oz: 2
      length_in: 8
      width_in: 6
      height_in: 1
      stack_height_in: 0.2
      usps_domestic:
        processing_category: MACHINABLE
        rate_indicator: SP
        mail_classes:
          - MEDIA_MAIL
          - USPS_GROUND_ADVANTAGE
          - PRIORITY_MAIL
    bluray:
      weight_oz: 4
      packaging_weight_oz: 2
      length_in: 7.25
      width_in: 5.75
      height_in: 0.9
      stack_height_in: 0.2
      usps_domestic:
        processing_category: MACHINABLE
        rate_indicator: SP
        mail_classes:
          - MEDIA_MAIL
          - USPS_GROUND_ADVANTAGE
          - PRIORITY_MAIL
    signed_script:
      weight_oz: 7
      packaging_weight_oz: 1
      length_in: 11.5
      width_in: 8.5
      height_in: 0.5
      stack_height_in: 0.1
      manual_domestic_rate: FIRST_CLASS_FLAT
      usps_domestic:
        processing_category: NON_MACHINABLE
        rate_indicator: SP
        mail_classes:
          - MEDIA_MAIL
          - USPS_GROUND_ADVANTAGE
          - PRIORITY_MAIL

reports:
  campaign_runner:
    enabled: true
    daily_pledge_report_enabled: true
    fulfillment_report_enabled: true
    send_hour: 7
    send_minute: 0
    include_stats_summary: true
    include_csv_attachment: true
    email_subject_prefix: "[The Pool]"

checkout:
  stripe_publishable_key: "pk_live_51N48NKK9nUOzi4tvVuw9UdqVYGLyre50ex4s4giogLQDgUfejp0lfSxV6ZXRdiqN8RY7t0IDIRjiWQ192hcXWVSl00Htn02Ci3"

