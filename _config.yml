      image_url: "/assets/images/add-ons/butterfingers-tshirt.png"
      price: 25.00
      category: physical
      shipping_preset: tshirt
      source_url: "https://shop.dustwave.xyz/"
      variant_option_name: Size
      variants:
        - { id: xs, label: XS, inventory: 1 }
        - { id: s, label: S, inventory: 2 }
        - { id: m, label: M, inventory: 4 }
        - { id: l, label: L, inventory: 4 }
        - { id: xl, label: XL, inventory: 2 }
        - { id: 2xl, label: 2XL, inventory: 1 }
        - { id: 3xl, label: 3XL, inventory: 1 }

cache:
